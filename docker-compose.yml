services:
  app:
    image: kr2-app:1.0
    build: .
    env_file: .env
    environment:
      REDIS_HOST: redis
      STUDENT: Okhotnikov
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  redis_data:
